# Netlify reads this file before the UI settings, so the publish folder always matches the Angular output.
[build]
  command = "npm run build"
  publish = "dist/orlando-my-journey/browser"

[build.environment]
  NODE_VERSION = "24"

# Hashed bundles never change, so browsers can cache them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
